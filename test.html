<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Submitバグの再現実験</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .info-box {
            background-color: #f0f0f0;
            padding: 15px;
            border-left: 5px solid #007bff;
            margin-bottom: 20px;
        }
        .monitor {
            background-color: #333;
            color: #0f0; /* 緑色の文字 */
            padding: 10px;
            font-family: monospace;
            margin-bottom: 20px;
        }
        .form-area {
            border: 2px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .btn-bug { background-color: #ffcccc; border: 1px solid #f00; color: #d00; font-weight: bold; }
        .btn-ok { background-color: #ccffcc; border: 1px solid #0a0; color: #006400; font-weight: bold; }
        li { font-size: 1.2em; border-bottom: 1px solid #eee; padding: 5px; }
    </style>
</head>
<body>

    <h1>⚠️ type="submit" のバグ再現実験</h1>

    <div class="monitor">
        ページ読み込み時刻（リロードされると更新されます）:<br>
        <span id="loadTime" style="font-size: 1.5em; font-weight: bold;"></span>
    </div>

    <div class="info-box">
        <p><strong>実験手順：</strong></p>
        <ol>
            <li>テキストボックスに何か文字を入力します。</li>
            <li>「【バグ発生】追加して送信」ボタンを押します。</li>
            <li><strong>画面にリストが追加されたこと</strong>を確認してください。</li>
            <li>アラートの「OK」を押すと...？（リロードが発生し、リストが消えます）</li>
        </ol>
    </div>

    <form class="form-area">
        <h3>新しい記事を追加</h3>
        <input type="text" id="inputTitle" name="title" placeholder="記事のタイトル" size="30">
        <br><br>

        <button type="submit" class="btn-bug" onclick="handleAddBug()">
            【バグる】<br>(type="submit")
        </button>

        <button type="button" class="btn-ok" onclick="handleAddCorrect()">
            【おすすめ】<br>(type="button")
        </button>
    </form>

    <h3>記事リスト（JavaScriptで管理）</h3>
    <ul id="postList">
        </ul>

    <script>
        // ページが読み込まれた時刻を表示
        const now = new Date();
        const timeString = now.getHours() + "時" + now.getMinutes() + "分" + now.getSeconds() + "秒" + now.getMilliseconds();
        document.getElementById("loadTime").innerText = timeString;

        // 【バグ発生パターン】の処理
        function handleAddBug() {
            addList("（バグ発生ボタンによる追加）");
            
            // 重要：ここで処理を一時停止させます。
            // これがないと一瞬でリロードされてしまい、追加されたことすら目視できません。
        }

        // 【正解パターン】の処理
        function handleAddCorrect() {
            addList("（正解ボタンによる追加）");
            // こちらはtype="button"なので、何もしなくてもリロードされません。
        }

        // 共通：画面にリストを追加する関数
        function addList(suffix) {
            const input = document.getElementById("inputTitle");
            const list = document.getElementById("postList");
            const text = input.value || "タイトルなし";

            const newItem = document.createElement("li");
            newItem.textContent = "📝 " + text + " " + suffix;
            newItem.style.backgroundColor = "#fff0f5"; // 追加されたのがわかるよう色付け
            list.appendChild(newItem);
        }
    </script>
</body>
</html>
